<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}KrabsVault{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>

<header>
  {% block header %}{% endblock %}
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  KrabsVault &copy; 2026 — Bikini Bottom
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
