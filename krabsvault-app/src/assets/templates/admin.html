{% extends "base.html" %}

{% block title %}Demo Admin — KrabsVault{% endblock %}

{% block header %}
  <nav class="vault-nav">
  <span class="vault-brand-name">
        <span class="material-symbols-outlined">security</span>
        KrabsVault
      </span>
    <span class="vault-greeting">
      Demo Control Center
    </span>
  </nav>
  <div id="status-toast" class="infobox" style="display: none;">
  </div>
{% endblock %}

{% block content %}
  <div class="vault-panel">
    <div class="rivet rivet-tl"></div>
    <div class="rivet rivet-tr"></div>
    <div class="rivet rivet-bl"></div>
    <div class="rivet rivet-br"></div>


    <div style="display: flex; flex-direction: column; gap: 1.25rem;">

      <!-- Password mode card -->
      <button class="security-level" id="btn-password" onclick="setSecurityLevel('password')">
        <span class="security-level-title">
          🔑 Level 1: Password Only
        </span>
        <span class="security-level-description">
          Only standard password authentication is active. MFA is disabled, and Passkey buttons are
          hidden.
        </span>
      </button>

      <!-- MFA mode card -->
      <button class="security-level" id="btn-mfa" onclick="setSecurityLevel('mfa')">
        <span class="security-level-title">
          🔐 Level 2: Password + MFA (OTP)
        </span>
        <span class="security-level-description">
          Bob must enter his password followed by a 6-digit MFA code. Passkey buttons remain hidden.
        </span>
      </button>

      <!-- Passkeys mode card -->
      <button class="security-level" id="btn-passkey" onclick="setSecurityLevel('passkey')">
        <span class="security-level-title">
          🛡️ Level 3: Passkeys Enabled
        </span>
        <span class="security-level-description">
          Passkeys are fully enabled. Bob can register passkeys in the vault and log in
          passwordless.
        </span>
      </button>

    </div>

  </div>
{% endblock %}

{% block scripts %}
  <script>
    let currentLevel = "{{ security_level }}";
    const toast = document.getElementById('status-toast');

    function updateActiveButtonUI() {
      // Reset all buttons
      document.querySelectorAll('.security-level').forEach(btn => {
        btn.classList.remove('active');
      });

      // Highlight active button
      const activeBtn = document.getElementById(`btn-${currentLevel}`);
      if (activeBtn) {
        activeBtn.classList.add('active');
      }
    }

    async function setSecurityLevel(level) {
      try {
        const response = await fetch('/api/security-level', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({level: level}),
        });

        if (response.ok) {
          const data = await response.json();
          currentLevel = data.security_level;
          updateActiveButtonUI();

          toast.textContent = `Security level switched to: ${level.toUpperCase()}`;
          toast.style.display = 'block';

          setTimeout(() => {
            toast.style.display = 'none';
          }, 3000);
        } else {
          toast.textContent = `Failed to update security level to: ${level.toUpperCase()}`;
          toast.classList.add('error');
          toast.style.display = 'block';

          setTimeout(() => {
            toast.style.display = 'none';
            toast.classList.remove('error');
          }, 3000);
        }
      } catch (err) {
        console.error('Error updating security level:', err);
        alert('Error: ' + err.message);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateActiveButtonUI();
    });
  </script>
{% endblock %}

{% block reload_trigger %}
{% endblock %}
